# Render blueprint: FastAPI web service + managed PostgreSQL.
services:
  - type: web
    name: tesseract-hrms-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tesseract-hrms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app  # update after Vercel deploy
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CLERK_SECRET_KEY
        sync: false  # set manually in the Render dashboard — do not commit this value
      - key: CLERK_PUBLISHABLE_KEY
        sync: false  # set manually in the Render dashboard

databases:
  - name: tesseract-hrms-db
    plan: free
