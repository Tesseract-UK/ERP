# Render blueprint: FastAPI web service. The database is Supabase PostgreSQL.
# All real values live in the gitignored root .env.production — paste them into
# Render → Environment → "Add from .env".
services:
  - type: web
    name: tesseract-hrms-api
    runtime: python
    region: singapore  # same region as the Supabase database — keep them together
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      # Supabase → Connect → "Session pooler" URI (IPv4; Render cannot reach the
      # IPv6-only direct host). Append ?sslmode=require. Set in the dashboard.
      - key: DATABASE_URL
        sync: false
      # First Admin for an empty database (Render free tier has no shell).
      # Ignored once an Admin exists — delete these after the first deploy.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://payroll.tesseractuk.in
      - key: ALLOWED_EMAIL_DOMAINS
        value: tesseractuk.in
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: AUTH_SESSION_MAX_DAYS
        value: "7"
      - key: FRONTEND_URL
        value: https://payroll.tesseractuk.in
      - key: GOOGLE_REDIRECT_URI
        sync: false  # set to the exact HTTPS callback URL of this Render service
      - key: GOOGLE_CLIENT_ID
        sync: false  # set in the Render dashboard; never commit the credential
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # set in the Render dashboard; never commit the credential
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: PYTHON_VERSION
        value: 3.11.9
      # Email via Gmail API (Mitaly's Workspace account, sent as notifications@).
      - key: EMAIL_BACKEND
        value: console  # switch to gmail_api once GMAIL_REFRESH_TOKEN is set
      - key: EMAIL_FROM
        value: Tesseract HRMS <notifications@tesseractuk.in>
      - key: GMAIL_SENDER
        sync: false  # existing Workspace account that sends, e.g. hr@tesseractuk.in
      - key: GMAIL_REFRESH_TOKEN
        sync: false  # from `python -m scripts.gmail_token <account>` — never commit
