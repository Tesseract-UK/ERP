# Render blueprint: FastAPI web service + managed PostgreSQL.
services:
  - type: web
    name: tesseract-hrms-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tesseract-hrms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://payroll.tesseractuk.in
      - key: ALLOWED_EMAIL_DOMAINS
        value: tesseractuk.in
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: AUTH_SESSION_MAX_DAYS
        value: "7"
      - key: FRONTEND_URL
        value: https://payroll.tesseractuk.in
      - key: GOOGLE_REDIRECT_URI
        sync: false  # set to the exact HTTPS callback URL of this Render service
      - key: GOOGLE_CLIENT_ID
        sync: false  # set in the Render dashboard; never commit the credential
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # set in the Render dashboard; never commit the credential
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: PYTHON_VERSION
        value: 3.11.9
      # Email: "console" only logs. Switch to "smtp" once the
      # notifications@tesseractuk.in App Password exists.
      - key: EMAIL_BACKEND
        value: console
      - key: EMAIL_FROM
        value: Tesseract HRMS <notifications@tesseractuk.in>
      - key: SMTP_USERNAME
        sync: false  # notifications@tesseractuk.in
      - key: SMTP_PASSWORD
        sync: false  # Google Workspace App Password — never commit

databases:
  - name: tesseract-hrms-db
    plan: free
